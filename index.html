<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>英文点读跟读</title>
<meta name="theme-color" content="#f5f7fb">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#dfe4ea;
--blue:#2563eb;--blueSoft:#dbeafe;--green:#0f766e;--greenSoft:#ccfbf1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
.hero,.toolbar,.passage{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(20,35,70,.06)}
.hero{padding:22px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,32px)}
.hero p{margin:0;color:var(--muted);line-height:1.7}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 0 6px;-webkit-overflow-scrolling:touch}
.tab,.ctrl{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700}
.tab{white-space:nowrap;border-radius:999px}
.tab.active,.ctrl.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.toolbar{position:sticky;top:8px;z-index:20;padding:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
select.ctrl{padding-right:30px}
.status{font-size:14px;color:var(--muted)}
.passage{padding:18px}
.unit{padding:10px 12px;border-radius:14px;line-height:1.95;margin:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.unit.active{background:var(--blueSoft);box-shadow:inset 4px 0 0 var(--blue)}
.unit.title{font-size:26px;font-weight:800}
.unit.heading{font-size:21px;font-weight:800;margin-top:18px}
.unit.sentence{font-size:20px}
.word{display:inline;background:transparent;border:0;padding:1px 2px;margin:0;font:inherit;color:inherit;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.word:active,.word.speaking{background:var(--greenSoft);color:var(--green);font-weight:800}
.word.following{background:#fef3c7;color:#92400e;font-weight:800;box-shadow:0 0 0 2px #fde68a inset}
.note{font-size:13px;color:var(--muted);width:100%}
@media(min-width:768px){
  .wrap{padding-left:28px;padding-right:28px}
  .hero{padding:28px}
  .passage{padding:26px}
  .unit.sentence{font-size:23px;line-height:2.05}
  .unit.title{font-size:30px}
  .unit.heading{font-size:24px}
}
</style>
</head>

  <div class="hero">
    <h1>英文点读跟读 · 3 篇</h1>
    <p>点整句播放原始录音中的对应句子；点单词单独发音。支持 iPhone 与 iPad Safari，横屏和竖屏都会自适应。</p>
  </div>

  <nav class="tabs" aria-label="文章切换"><button class="tab active" type="button" data-p="0">The Four Seasons</button><button class="tab" type="button" data-p="1">My Favourite Season: Summer</button><button class="tab" type="button" data-p="2">The 24 Solar Terms</button></nav>

    <button class="ctrl" id="repeatAll" type="button">↻ 全文重复读</button>
    <button class="ctrl" id="fluentRead" type="button">🎧 流利朗读</button>

        <option value="1.1">1.1×</option>

    <div class="note">蓝色＝当前句｜黄色＝原音频读到的单词｜绿色＝点读单词</div>

let pIndex=0,uIndex=0,stopAt=null,continuous=false,repeatAll=false,fluentMode=false,fluentRAF=null,wordEl=null,followWordEl=null;
const speed=document.getElementById('speed');
const statusEl=document.getElementById('status');

function aud(){return document.getElementById('audio-'+pIndex)}

let audioUnlocked=false;
async function unlockAudio(){
  if(audioUnlocked)return;
  const a=aud();
  try{
    a.muted=true;
    await a.play();
    a.pause();
    a.currentTime=0;
    a.muted=false;
    audioUnlocked=true;
  }catch(e){
    a.muted=false;
  }
}

function units(){return [...document.querySelectorAll('#passage-'+pIndex+' .unit')]}

function activate(i, scroll=true){
  const us=units();
  if(!us.length)return;
  uIndex=Math.max(0,Math.min(i,us.length-1));
  clearFollow();
  document.querySelectorAll('.unit.active').forEach(x=>x.classList.remove('active'));
  us[uIndex].classList.add('active');
  if(scroll) us[uIndex].scrollIntoView({behavior:'smooth',block:'center'});
}

function switchPassage(i){
  document.querySelectorAll('audio').forEach(a=>a.pause());
  speechSynthesis.cancel();
  continuous=false; stopAt=null; pIndex=i; uIndex=0;
  document.querySelectorAll('.passage').forEach((s,j)=>s.hidden=j!==i);
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('active',j===i));
  activate(0,false); statusEl.textContent='准备就绪';
}


function clearFollow(){
  if(followWordEl){followWordEl.classList.remove('following');followWordEl=null}
  document.querySelectorAll('.word.following').forEach(x=>x.classList.remove('following'));
}
function syncWordHighlight(){
  const a=aud();
  const u=passages[pIndex].units[uIndex];
  if(!u || !u.wordTimings || !u.wordTimings.length){ clearFollow(); return; }
  const ws=[...units()[uIndex].querySelectorAll('.word')];
  const t=a.currentTime;
  let idx=-1;
  for(let i=0;i<u.wordTimings.length;i++){
    const w=u.wordTimings[i];
    if(t>=w.start && t<=w.end){ idx=i; break; }
  }
  if(idx<0){
    // During punctuation pauses, keep the nearest previous word highlighted briefly.
    for(let i=u.wordTimings.length-1;i>=0;i--){
      if(t>=u.wordTimings[i].end){ idx=i; break; }
    }
  }
  if(idx>=0 && ws[idx]){
    if(followWordEl!==ws[idx]){
      if(followWordEl) followWordEl.classList.remove('following');
      followWordEl=ws[idx];
      followWordEl.classList.add('following');
    }
  }
}


function stopFluentMode(){
  fluentMode=false;
  if(fluentRAF){ cancelAnimationFrame(fluentRAF); fluentRAF=null; }
}
function fluentHighlightLoop(){
  if(!fluentMode) return;
  const a=aud();
  const us=units();
  const t=a.currentTime;
  let found=-1;
  for(let i=0;i<us.length;i++){
    const s=parseFloat(us[i].dataset.start), e=parseFloat(us[i].dataset.end);
    if(t>=s && t<=e){ found=i; break; }
  }
  if(found>=0 && found!==uIndex){
    uIndex=found;
    setActiveUnit(us[found]);
  }
  if(!a.paused && !a.ended) fluentRAF=requestAnimationFrame(fluentHighlightLoop);
}
async function startFluent(rate=1){
  stopSpeech();
  stopFluentMode();
  continuous=false; repeatAll=false;
  const a=aud();
  document.querySelectorAll('audio').forEach(x=>{ if(x!==a) x.pause(); });
  a.pause();
  a.playbackRate=rate;
  speed.value=String(rate);
  a.currentTime=0;
  fluentMode=true;
  statusEl.textContent=rate<1?'影子跟读 '+rate+'×：原音连续播放':'流利朗读：原音连续播放';
  try{
    await a.play();
    fluentHighlightLoop();
  }catch(e){
    statusEl.textContent='播放失败，请再点一次';
    stopFluentMode();
  }
}

async function playUnit(i, keepContinuous=false){
  stopFluentMode();
  await unlockAudio();
  speechSynthesis.cancel();
  continuous=keepContinuous;
  activate(i);

  const us=passages[pIndex].units;
  const u=us[uIndex], a=aud();
  const prev=uIndex>0 ? us[uIndex-1] : null;
  const next=uIndex<us.length-1 ? us[uIndex+1] : null;

  // iPhone/iPad Safari can clip the first phoneme when seeking directly to
  // the exact MP3 timestamp. Start slightly inside the preceding silence,
  // and leave a little tail after the unit. Pads are limited by neighboring
  // units so previous/next speech does not leak in.
  const gapBefore=prev ? Math.max(0, u.start-prev.end) : u.start;
  const gapAfter=next ? Math.max(0, next.start-u.end) : 0.30;
  const leadIn=Math.min(0.24, gapBefore*0.80);
  const tailOut=Math.min(0.18, gapAfter*0.70);
  const playStart=Math.max(0, u.start-leadIn);
  stopAt=u.end+tailOut;

  a.playbackRate=parseFloat(speed.value);
  try {
    // Pause first, then seek, which is more reliable on iOS Safari.
    a.pause();
    a.currentTime=playStart;
    await a.play();
    statusEl.style.color='';
    statusEl.textContent='正在朗读';
  } catch(e) {
    statusEl.textContent='请再点一次句子或播放按钮';
  }
}

document.querySelectorAll('audio').forEach(a=>{
  a.addEventListener('error',()=>{
    const src=a.getAttribute('src')||'未知音频';
    statusEl.textContent='音频加载失败：'+src;
    statusEl.style.color='#b91c1c';
  });
  a.addEventListener('loadedmetadata',()=>{
    if(statusEl.textContent.startsWith('音频加载失败：')){
      statusEl.textContent='音频已加载';
      statusEl.style.color='';
    }
  });
  a.addEventListener('timeupdate',()=>{
    if(a!==aud() || stopAt===null)return;
    syncWordHighlight();
    if(a.currentTime>=stopAt){
      a.pause(); stopAt=null; clearFollow();
      if(continuous){
        const n=uIndex+1;
        if(n<units().length) setTimeout(()=>playUnit(n,true),180);
        else {continuous=false;statusEl.textContent='朗读完成'}
      } else statusEl.textContent='已完成本句';
    }
  });
});

function speakWord(word,el){
  aud().pause(); stopAt=null; continuous=false; clearFollow();
  speechSynthesis.cancel();
  if(wordEl)wordEl.classList.remove('speaking');
  wordEl=el;el.classList.add('speaking');
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-GB';
  u.rate=parseFloat(speed.value)<=0.8?0.72:0.86;
  const vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>/^en-GB$/i.test(v.lang) && /Daniel|Serena|Martha|Arthur|British|UK/i.test(v.name))
       || vs.find(v=>/^en-GB$/i.test(v.lang))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
  u.onend=()=>{el.classList.remove('speaking');statusEl.textContent='单词发音完成'};
  u.onerror=()=>el.classList.remove('speaking');
  statusEl.textContent='单词：'+word;
  speechSynthesis.speak(u);
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchPassage(+b.dataset.p)));
document.querySelectorAll('.unit').forEach(el=>{
  el.addEventListener('click',e=>{
    if(e.target.closest('.word'))return;
    playUnit(+el.dataset.u,false);
  });
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playUnit(+el.dataset.u,false)}});
});
document.querySelectorAll('.word').forEach(w=>w.addEventListener('click',e=>{
  e.stopPropagation();speakWord(w.dataset.word,w);
}));
document.getElementById('playAll').onclick=()=>playUnit(uIndex,true);
document.getElementById('prev').onclick=()=>playUnit(Math.max(0,uIndex-1),false);
document.getElementById('next').onclick=()=>playUnit(Math.min(units().length-1,uIndex+1),false);
document.getElementById('repeat').onclick=()=>playUnit(uIndex,false);
speed.onchange=()=>{aud().playbackRate=parseFloat(speed.value)};
window.speechSynthesis && speechSynthesis.getVoices();
activate(0,false);

document.getElementById('repeatAll').onclick=()=>{
  repeatAll=true;
  continuous=true;
  statusEl.textContent='全文重复朗读';
  playUnit(0,true);
};


document.getElementById('fluentRead').onclick=()=>startFluent(1);
document.getElementById('shadow08').onclick=()=>startFluent(0.8);
document.getElementById('shadow10').onclick=()=>startFluent(1);


document.querySelectorAll('audio').forEach(a=>{
  a.addEventListener('ended',()=>{
    if(fluentMode){
      stopFluentMode();
      statusEl.textContent='全文朗读完成';
    }
  });
});

</script>
</body>
</html>
